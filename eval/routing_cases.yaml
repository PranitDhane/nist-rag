- {id: nist-5, category: nist_direct, message: "What are the suggested actions for GOVERN 1.7?", expect_route: nist_question, query_terms: [GOVERN 1.7]}
- {id: nist-6, category: nist_direct, message: "How do AI risks differ from traditional software risks?", expect_route: nist_question, query_terms: [risk, software]}
- {id: nist-7, category: nist_direct, message: "What is the difference between the AI RMF and the Generative AI Profile?", expect_route: nist_question, query_terms: [profile]}
- {id: nist-8, category: nist_direct, message: "Which risks are unique to or exacerbated by generative AI?", expect_route: nist_question, query_terms: [generative]}
- {id: nist-9, category: nist_direct, message: "Who are the AI actors described in the framework?", expect_route: nist_question, query_terms: [actor]}

