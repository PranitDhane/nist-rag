# Labelled routing cases (API_ROUTING_PLAN Stage R8). Run with: python -m eval.routing
# history: up to 2 turns [{user, assistant}], oldest first. query_terms: every term must appear (case-insensitive)
# in the standalone query of a nist_question. expect_source (optional): the router layer that must decide.
- {id: pure-1, category: pure_greeting, message: "Hi", expect_route: greeting, expect_source: rule}
- {id: pure-2, category: pure_greeting, message: "Thanks!", expect_route: greeting, expect_source: rule}
- {id: pure-3, category: pure_greeting, message: "Goodbye", expect_route: greeting, expect_source: rule}

