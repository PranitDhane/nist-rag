# Retrieval evaluation set (RETRIEVAL_PLAN Stage T6). Gold targets are STRUCTURAL, never chunk IDs.
# A retrieved chunk "hits" if it satisfies ALL keys of ANY one target. Target keys:
#   doc_id (required): ai_rmf_1_0 | genai_profile
#   section:      a section_path element STARTS WITH this text (so a parent section also matches its subsections)
#   subcategory:  chunk.subcategory equals it, or it is in chunk.subcategories (AI RMF Core tables)
#   action_id:    in chunk.action_ids          function: chunk.function equals it
#   figure:       figure_number                footnote: footnote_number
#   chunk_type:   optional extra filter        text_contains: optional case-insensitive substring of embed_text
# answerable: false => no gold; used for threshold tuning (best rerank score should be LOW).
# kind: free-text tag used in the report (exact_id | table | figure | footnote | paraphrase | both_docs | direct | near_scope).

cases:
  # ---- assignment examples -------------------------------------------------------------------
  - id: c01
    kind: direct
    query: What are the four core functions of the NIST AI RMF?
    gold:
      - {doc_id: ai_rmf_1_0, section: "5 AI RMF Core"}
      - {doc_id: ai_rmf_1_0, section: "Executive Summary"}
  - id: c02
    kind: direct
    query: Which of the four AI RMF functions is cross-cutting?
    gold:
      - {doc_id: ai_rmf_1_0, section: "5.1 Govern"}
      - {doc_id: ai_rmf_1_0, section: "5 AI RMF Core", figure: 5}
      - {doc_id: ai_rmf_1_0, section: "5 AI RMF Core", text_contains: "cross-cutting"}

  # ---- exact identifiers ---------------------------------------------------------------------
  - id: c03
    kind: exact_id
    query: GV-1.7-001
